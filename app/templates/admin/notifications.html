{% extends "components/base.html" %}
{% block title %}Notifications - Admin{% endblock %}
{% block body %}
<div class="app-layout">
  {% include "components/sidebar_admin.html" %}
  <main class="main-content">
    <h1 class="page-title">Send Notification</h1>
    {% include "components/flashes.html" %}

    <div class="card" style="margin-bottom:1.5rem">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label class="form-label">Target</label>
          <select name="target" class="form-control">
            <option value="all">All Users</option>
            <option value="players">Players Only</option>
            <option value="agents">Agents Only</option>
            <option value="user">Specific User ID</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">User ID (if specific)</label><input type="number" name="user_id" class="form-control" placeholder="Optional"></div>
        <div class="form-group"><label class="form-label">Title</label><input type="text" name="title" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Message</label><textarea name="message" class="form-control" rows="3" required></textarea></div>
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>
  </main>
</div>
{% endblock %}
