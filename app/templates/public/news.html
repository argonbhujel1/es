{% extends "components/base.html" %}
{% block title %}News - ESPORTS ARENA{% endblock %}
{% block body %}
<div class="public-content">
  <h1 class="page-title">News</h1>
  {% for item in news_items %}
  <div class="card">
    <h2 style="color:#fff"><a href="{{ url_for('public.news_detail', slug=item.slug) }}">{{ item.title }}</a></h2>
    <p style="color:var(--text-muted);font-size:0.85rem">{{ item.published_at.strftime('%Y-%m-%d') if item.published_at else '' }}</p>
  </div>
  {% else %}
  <p class="empty-state">No news yet.</p>
  {% endfor %}
</div>
{% endblock %}
