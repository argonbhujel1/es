{% extends "components/base.html" %}
{% block title %}Register - ESPORTS ARENA{% endblock %}
{% block body %}
<div class="public-content" style="max-width:480px;margin:2rem auto">
  <h1 class="page-title">Create Account</h1>
  {% include "components/flashes.html" %}
  <div class="card">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required minlength="3">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">Phone (optional)</label>
        <input type="text" name="phone" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p style="margin-top:1rem;text-align:center;color:var(--text-muted)">
      Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
