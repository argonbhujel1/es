{% extends "components/base.html" %}
{% block title %}Login - ESPORTS ARENA{% endblock %}
{% block body %}
<div class="public-content" style="max-width:420px;margin:3rem auto">
  <h1 class="page-title">Login</h1>
  {% include "components/flashes.html" %}
  <div class="card">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="form-group">
        <label><input type="checkbox" name="remember"> Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p style="margin-top:1rem;text-align:center;color:var(--text-muted)">
      No account? <a href="{{ url_for('auth.register') }}">Register</a>
    </p>
  </div>
</div>
{% endblock %}
